name: Keep API warm

# Render's free tier sleeps a service after ~15 min of inactivity; the next
# request then cold-starts for ~50s. Pinging /health on a schedule keeps it
# awake so the Vercel build and real visitors never hit a cold start.
#
# Caveat: GitHub's scheduled runner is best-effort and can be delayed several
# minutes under load, and the schedule is auto-disabled after 60 days with no
# repo activity. A ~10 min interval gives margin under the 15 min sleep window,
# but it is not a hard guarantee — for SLA-grade uptime use a dedicated pinger
# (UptimeRobot) or a paid Render plan.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Don't pile up overlapping pings if a cold start makes one run long.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API health
        env:
          # Override in repo Settings → Secrets and variables → Actions → Variables
          # if the API URL changes; otherwise this default is used.
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://lotusorium-api.onrender.com/health' }}
        run: |
          echo "Pinging $API_HEALTH_URL"
          # --max-time tolerates a cold start (~50s); retry to ride out the wake-up.
          curl -fsS \
            --max-time 90 \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            -w '\nHTTP %{http_code} in %{time_total}s\n' \
            "$API_HEALTH_URL"
